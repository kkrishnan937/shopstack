services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopstack
      POSTGRES_PASSWORD: shopstack123
      POSTGRES_DB: shopstack
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: shopstack
      DB_PASSWORD: shopstack123
      DB_NAME: shopstack
      JWT_SECRET: local-dev-secret
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
